# =========================================================
# Always float dialogs / popups (file pickers, auth, etc.)
# File picker portals (common when attaching files in browsers/Apps)

windowrulev2 = float,class:^(xdg-desktop-portal-gtk|xdg-desktop-portal-kde)$
windowrulev2 = center,class:^(xdg-desktop-portal-gtk|xdg-desktop-portal-kde)$

# Extra safety: match common file chooser titles
windowrulev2 = float,title:^(Open File|Save File|Save As|Select|Choose|Upload).*
windowrulev2 = center,title:^(Open File|Save File|Save As|Select|Choose|Upload).*