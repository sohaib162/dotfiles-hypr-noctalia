add_newline = true
command_timeout = 800

format = """
$os$username$hostname$directory$git_branch$git_status
$character"""

[character]
success_symbol = "⚡ "
error_symbol = "⚡ "

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold blue"

[git_branch]
symbol = " "
style = "bold purple"

[git_status]
style = "bold yellow"

[os]
disabled = false
format = "[$symbol]($style) "
style = "bold cyan"

[os.symbols]
Fedora = ""
Linux = ""

[character]
success_symbol = "⚡ "
error_symbol = "💥 "
