add_newline = true
command_timeout = 800

format = """
$os$username$hostname$directory$git_branch$git_status
$character"""

[character]
success_symbol = "⚡ "
error_symbol = "💥 "

[battery]
full_symbol = "🔋"
charging_symbol = "⚡"
discharging_symbol = "💥"

[python]
symbol = "🐍"

[nodejs]
symbol = "🟢"

[rust]
symbol = "🦀"

[package]
symbol = "📦"

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold blue"

[git_branch]
symbol = " "
style = "bold purple"

[git_status]
style = "bold yellow"

[os]
disabled = false
format = "[$symbol]($style) "
style = "bold cyan"

[os.symbols]
Fedora = ""
Linux = ""

[character]
success_symbol = "⚡ "
error_symbol = "💥 "
